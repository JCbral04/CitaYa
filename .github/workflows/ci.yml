name: CI

# PoLP: por defecto ningún permiso; cada job declara solo lo que necesita
permissions: {}

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-frontend:
    name: Verificacion frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read   # necesario para actions/checkout
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar sintaxis de los módulos JS (ES)
        run: |
          find js -name "*.js" -print0 | while IFS= read -r -d '' f; do
            echo "Revisando $f"
            node --input-type=module --check < "$f"
          done

  test-backend:
    name: Pruebas backend (node:test + PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: cd backend && npm ci

      - name: Ejecutar pruebas
        run: cd backend && npm test
