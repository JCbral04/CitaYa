name: CI

# PoLP: por defecto ningún permiso; cada job declara solo lo que necesita
permissions: {}

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-frontend:
    name: Verificacion frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read   # necesario para actions/checkout
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar sintaxis de los módulos JS
        run: |
          for file in js/data.js js/api.js js/main.js js/ui/panel.js js/ui/citas.js js/ui/servicios.js; do
            echo "Verificando $file"
            node --input-type=module --check < "$file"
          done